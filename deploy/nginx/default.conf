# Single public entry: same host for Next.js (/) and FastAPI (/api with prefix stripped).
# Use with docker compose -f docker-compose.yml -f docker-compose.proxy.yml up

upstream bridge_web {
  server web:3000;
}

upstream bridge_api {
  server api:8000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # NextAuth — must reach Next.js (no strip)
  location ~ ^/api/auth/(signin|signout|callback|session|csrf|providers|error)(/|$) {
    proxy_pass http://bridge_web;
    include /etc/nginx/proxy_params;
  }

  # FastAPI auth — strip /api
  location ~ ^/api/auth/(magic-link|verify|sync)$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://bridge_api;
    include /etc/nginx/proxy_params;
  }

  # FastAPI — strip /api prefix
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://bridge_api;
    include /etc/nginx/proxy_params;
  }

  location = /api {
    return 301 /api/;
  }

  # Next.js app
  location / {
    proxy_pass http://bridge_web;
    include /etc/nginx/proxy_params;
  }
}
