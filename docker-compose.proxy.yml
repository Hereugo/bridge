# Public gateway: https://your-domain → nginx → web (/) and api (/api, prefix stripped).
# Usage: docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
services:
  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - web
      - api

  web:
    ports: []
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
